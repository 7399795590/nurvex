name: NURVEX Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Check syntax
        run: python -c "import ast; ast.parse(open('nurvex_node.py').read()); print('syntax OK')"

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Test CLI help
        run: python nurvex_node.py --help

      - name: Test init + validate
        run: |
          export NURVEX_DATA_DIR=/tmp/testnet
          python nurvex_node.py init
          python nurvex_node.py validate
          python nurvex_node.py status
